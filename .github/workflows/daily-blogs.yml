name: Daily TutorServices Blogs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tutorservices-blogs
  cancel-in-progress: false

jobs:
  generate-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this scheduled run should publish
        id: gate
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout website
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate two daily SEO blogs
        if: steps.gate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DAILY_BLOG_MODEL: gpt-5
        run: node scripts/generate-daily-blogs.mjs

      - name: Commit and push blog updates
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "TutorServices Blog Bot"
          git config user.email "tutorservices.in@gmail.com"
          git add blog.html sitemap.xml *.html assets/images/*.jpg
          if git diff --cached --quiet; then
            echo "No new blog changes to commit."
            exit 0
          fi
          git commit -m "Add daily TutorServices SEO blogs"
          git push
