name: Daily TutorServices Blogs

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "35 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tutorservices-blogs
  cancel-in-progress: false

jobs:
  generate-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this scheduled run should publish
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "35 9 * * *" ] && [ "$(TZ=Asia/Kolkata date +%Y-%m-%d)" != "2026-08-02" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping expired one-day 3:05 PM IST auto schedule test."
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout website
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if one-time auto test already completed
        id: marker
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event.schedule }}" = "35 9 * * *" ] && [ -f ".github/daily-blog-auto-test-2026-08-02.done" ]; then
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "One-time auto schedule test already completed."
            exit 0
          fi
          echo "can_publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true' && steps.marker.outputs.can_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate two daily SEO blogs
        if: steps.gate.outputs.should_run == 'true' && steps.marker.outputs.can_publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DAILY_BLOG_MODEL: gpt-5
        run: node scripts/generate-daily-blogs.mjs

      - name: Commit and push blog updates
        if: steps.gate.outputs.should_run == 'true' && steps.marker.outputs.can_publish == 'true'
        run: |
          git config user.name "TutorServices Blog Bot"
          git config user.email "tutorservices.in@gmail.com"
          if [ "${{ github.event.schedule }}" = "35 9 * * *" ]; then
            echo "Completed auto schedule test on $(TZ=Asia/Kolkata date)" > .github/daily-blog-auto-test-2026-08-02.done
          fi
          git add blog.html sitemap.xml *.html assets/images/*.jpg .github/daily-blog-auto-test-2026-08-02.done
          if git diff --cached --quiet; then
            echo "No new blog changes to commit."
            exit 0
          fi
          git commit -m "Add daily TutorServices SEO blogs"
          git push
